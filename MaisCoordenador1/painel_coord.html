<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Coordenação - Avisos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="estilo.css" rel="stylesheet">
</head>
<body>
    <div class="dashboard-wrapper">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="brand"><i class="bi bi-layers-fill text-success fs-4"></i> Portal Coordenador</div>
            <nav class="nav flex-column mb-auto">
                <a href="painel_coord.html" class="nav-link-sidebar active"><i class="bi bi-megaphone"></i> Gerenciar Avisos</a>
                <a href="duvidas_coord.html" class="nav-link-sidebar"><i class="bi bi-chat-left-dots"></i> Dúvidas</a>
                <a href="cronograma_coord.html" class="nav-link-sidebar"><i class="bi bi-calendar-event"></i> Cronograma</a>
            </nav>
            <a href="index.html" class="nav-link-sidebar mt-auto text-danger"><i class="bi bi-box-arrow-left"></i> Sair</a>
        </div>

        <!-- CONTEÚDO -->
        <div class="main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-0">Mural de Avisos</h2>
                    <p class="text-muted">Gerencie os recados para os alunos.</p>
                </div>
                <!-- Botão que abre o Modal de Novo Aviso -->
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalNovoAviso">
                    <i class="bi bi-plus-lg me-2"></i>Novo Aviso
                </button>
            </div>

            <div class="card p-0 overflow-hidden">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th class="ps-4">Título do Aviso</th>
                            <th>Data</th>
                            <th>Status</th>
                            <th class="text-end pe-4">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="ps-4 fw-semibold">Entrega de Relatório</td>
                            <td>12 Set 2026</td>
                            <td><span class="badge bg-success rounded-pill">Ativo</span></td>
                            <td class="text-end pe-4">
                                <button class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></button>
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL: NOVO AVISO -->
    <div class="modal fade" id="modalNovoAviso" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 16px; border: none;">
                <div class="modal-header border-bottom-0">
                    <h5 class="modal-title fw-bold">Criar Novo Aviso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Título</label>
                            <input type="text" class="form-control" placeholder="Ex: Mudança de sala...">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Mensagem</label>
                            <textarea class="form-control" rows="4" placeholder="Escreva o recado aqui..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-top-0">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-success">Publicar Aviso</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
