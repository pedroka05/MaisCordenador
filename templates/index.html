<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Início - Mais Coordenador</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', path = 'css/estilo.css') }}" rel="stylesheet">
    
    <style>
        body { 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            
            
            background-image: url("{{ url_for('static', path='images/fundo.webp') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        
        
        .cartao-escolha { 
            cursor: pointer; 
            text-decoration: none; 
            color: #333; 
            
            background-color: rgba(240, 248, 255, 0.65); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.6); 
            border-top: 1px solid rgba(255, 255, 255, 0.9); /* Borda superior */
        }
        
        .cartao-escolha:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 12px 24px rgba(0, 10, 30, 0.08); 
            background-color: rgba(255, 255, 255, 0.85); 
        }
        .icone-grande { font-size: 4rem; }
    </style>
</head>
<body>
    
   
    <div class="container text-center">
        
        <!-- LOGO -->
        
        <img src="{{ url_for('static', path='images/logo.png') }}" alt="Logo do Projeto" class="img-fluid mb-3" style="max-height: 150px;">
        <p class="text-muted mb-5">Selecione o seu perfil para acessar o sistema:</p>
        
        <div class="row justify-content-center g-4">
            <!-- ALUNO -->
            <div class="col-12 col-md-4">
                <a href="{{ url_for('student_login') }}" class="card cartao-escolha h-100 p-4">
                    <div class="card-body">
                        <i class="bi bi-person-badge icone-grande text-primary"></i>
                        <h4 class="card-title mt-3 fw-bold">Sou Aluno</h4>
                        <span class="btn btn-outline-primary mt-3">Entrar como Aluno</span>
                    </div>
                </a>
            </div>

            <!-- COORDENADOR -->
            <div class="col-12 col-md-4">
                <a href="login_coord.html" class="card cartao-escolha h-100 p-4">
                    <div class="card-body">
                        <i class="bi bi-briefcase icone-grande text-success"></i>
                        <h4 class="card-title mt-3 fw-bold">Sou Coordenador</h4>
                        <span class="btn btn-outline-success mt-3">Entrar como Coordenador</span>
                    </div>
                </a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
