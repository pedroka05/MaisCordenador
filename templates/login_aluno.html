<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{{ url_for('static', path = 'css/estilo.css') }}" rel="stylesheet">
    
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card login-card p-4">
            <div class="card-body">
                <a href="index.html" class="text-decoration-none text-muted mb-3 d-inline-block"><i class="bi bi-arrow-left"></i> Voltar</a>
                <h4 class="text-center mb-4 text-primary">Portal do Estudante</h4>
                <form method="post" action="/login_aluno">
                    <div class="mb-3">
                        <label class="form-label" for="id">Sua matricula</label><br>
                        <input type="text" name="id" class="form-control" id="id" placeholder="000000" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="password">Senha</label>
                        <input type="password" name="password" class="form-control" id="password" placeholder="••••••••" required>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Entra</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
