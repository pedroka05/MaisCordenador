<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="estilo.css" rel="stylesheet">
    <style>
        body { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card login-card p-4">
            <div class="card-body">
                <a href="index.html" class="text-decoration-none text-muted mb-3 d-inline-block"><i class="bi bi-arrow-left"></i> Voltar</a>
                <h4 class="text-center mb-4 text-primary">Portal do Estudante</h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label">E-mail</label>
                        <input type="email" class="form-control" placeholder="nome@aluno.edu.br">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="d-grid mt-4">
                        <a href="painel_aluno.html" class="btn btn-primary btn-lg">Entrar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
