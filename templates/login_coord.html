<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Coordenação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="estilo.css" rel="stylesheet">
    <style>
        body { background-color: #212529; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; border-top: 5px solid #198754; }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card login-card p-4 bg-white">
            <div class="card-body">
                <a href="index.html" class="text-decoration-none text-muted mb-3 d-inline-block"><i class="bi bi-arrow-left"></i> Voltar</a>
                <div class="text-center mb-4">
                    <i class="bi bi-briefcase-fill text-success fs-1"></i>
                    <h4 class="mt-2">Coordenação</h4>
                </div>
                <form>
                    <div class="mb-3">
                        <label class="form-label">E-mail Institucional</label>
                        <input type="email" class="form-control" placeholder="coordenador@edu.br">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Senha</label>
                        <input type="password" class="form-control" placeholder="••••••••">
                    </div>
                    <div class="d-grid">
                        <a href="painel_coord.html" class="btn btn-success btn-lg">Acessar Painel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
